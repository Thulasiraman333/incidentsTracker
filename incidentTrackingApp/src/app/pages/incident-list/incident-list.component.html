<div class="container">
  <div class="row">
    @for(incident of incidentList; track $index) {
    <div class="col-md-4" style="margin-bottom: 10px;">
      <div class="card incident-card">
        <div class="card-header">{{incident.title}}</div>
        <div class="card-body">
          <p><strong>Description:</strong> {{incident.description}}</p>
          <p><strong>Priority:</strong> {{incident.priority}}</p>
          <p><strong>Status:</strong> <span
              class="badge bg-${getStatusClass(incident.status)}">{{incident.status}}</span></p>
          <p><strong>Created By:</strong> {{incident.createdBy.userName}}</p>
          <p><strong>Assigned To:</strong> {{incident.assignedTo.userName}}</p>
        </div>
        <div class="card-footer">
          <button class="btn btn-outline-primary btn-sm">View Details</button>
        </div>
      </div>
    </div>
    }
  </div>
</div>
